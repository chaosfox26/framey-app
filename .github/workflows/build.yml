name: build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the builds to (leave empty to only build)
        required: false
        default: ""
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      framey: ${{ steps.sha.outputs.framey }}
      fan: ${{ steps.sha.outputs.fan }}
    steps:
      - id: sha
        run: |
          echo "framey=$(git ls-remote https://github.com/chaosfox26/framey refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "fan=$(git ls-remote https://github.com/chaosfox26/frame-fan refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
  build:
    needs: pin
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: FrameyApp-windows.exe
          - os: ubuntu-latest
            asset: FrameyApp-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            asset: FrameyApp-linux-arm64.tar.gz
          - os: macos-latest
            asset: FrameyApp-macos.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fetch the pinned repos that get bundled
        shell: bash
        run: |
          fetch() { git init -q "$1" && git -C "$1" fetch -q --depth 1 "https://github.com/chaosfox26/$2" "$3" && git -C "$1" checkout -q FETCH_HEAD; }
          fetch ../Framey framey "${{ needs.pin.outputs.framey }}"
          fetch ../frame-fan frame-fan "${{ needs.pin.outputs.fan }}"
          python3 tools/pack.py || python tools/pack.py
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_RC_COMPILER=llvm-rc
          cmake --build build
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libgtk-3-dev pkg-config
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build
      - name: Build (macOS, universal)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build
          lipo -info build/FrameyApp
      - name: Package
        shell: bash
        run: |
          mkdir out
          if [ "$RUNNER_OS" = "Windows" ]; then cp build/FrameyApp.exe out/${{ matrix.asset }}; else cp build/FrameyApp LICENSE out/ && tar -czf ${{ matrix.asset }} -C out FrameyApp LICENSE && rm out/FrameyApp out/LICENSE && mv ${{ matrix.asset }} out/; fi
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
  publish:
    if: ${{ inputs.tag != '' }}
    needs: [pin, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the release tag points at this commit
        run: |
          tagsha=$(gh api "repos/${{ github.repository }}/commits/${{ inputs.tag }}" --jq .sha)
          [ "$tagsha" = "${{ github.sha }}" ] || { echo "Tag ${{ inputs.tag }} is $tagsha, not ${{ github.sha }}"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Checksums and provenance
        run: |
          cd out
          sha256sum FrameyApp-* > SHA256SUMS.txt
          printf 'framey-app %s\nframey %s\nframe-fan %s\n' "${{ github.sha }}" "${{ needs.pin.outputs.framey }}" "${{ needs.pin.outputs.fan }}" > PROVENANCE.txt
          cat SHA256SUMS.txt PROVENANCE.txt
      - name: Attach everything to the release
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/LICENSE" -o out/LICENSE.txt
          gh release upload "${{ inputs.tag }}" out/* --repo "${{ github.repository }}"
